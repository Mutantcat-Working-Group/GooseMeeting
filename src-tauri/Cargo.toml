[package]
name = "goosemeeting"
version = "1.0.20260919"
description = "GooseMeeting desktop video conferencing client"
authors = ["GooseMeeting contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
