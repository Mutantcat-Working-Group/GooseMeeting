name: Desktop Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (or branch for preflight)
        required: true
        type: string
      preflight:
        description: Build and verify installers without publishing a release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate release tag
        id: version
        env:
          BUILD_REF: ${{ inputs.tag || github.ref_name }}
          PREFLIGHT: ${{ inputs.preflight || false }}
        run: |
          if [ "$PREFLIGHT" = "true" ]; then
            npm run release:check
          else
            RELEASE_TAG="$BUILD_REF" npm run release:check
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$BUILD_REF^{commit}")"
          fi
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm run lint
      - run: npm run test:unit -- --runInBand

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            bundle: nsis
            extension: exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
            bundle: app,dmg
            extension: dmg
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            bundle: app,dmg
            extension: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            bundle: appimage
            extension: AppImage
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            bundle: appimage
            extension: AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux build and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-nice
          (sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2) || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci --ignore-scripts
      - name: Build native installer
        env:
          APPLE_SIGNING_IDENTITY: '-'
          CI: 'true'
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci
      - name: Verify app and sign DMG
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/GooseMeeting.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
          file "$app/Contents/MacOS/goosemeeting"
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            codesign --force --sign - "$dmg"
            codesign --verify --verbose=2 "$dmg"
            hdiutil verify "$dmg"
          done
      - name: Collect named installer
        run: node scripts/collect-installers.cjs ${{ matrix.target }} ${{ matrix.platform }} ${{ matrix.extension }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build]
    if: ${{ !inputs.preflight }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-artifacts
      - run: node scripts/verify-release.cjs
      - name: Upload complete release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "大鹅会议 $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
